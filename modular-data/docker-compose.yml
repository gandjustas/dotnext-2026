
services:
  monolith:
    image: modular-data
    build: &build
      context: .
      dockerfile: Web/Dockerfile      
    ports:
      - 5001:8080
    environment:
      ConnectionStrings__Postgres: Server=postgres;Port=5432;Database=modular;User Id=demo;Password=demo;Maximum Pool Size=90
      # Порядок важен: EF Core применяет конфигурации в порядке активации модулей,
      # а Monolith дополняет конфигурации, объявленные в Orders.Entities и Customers.Entities.
      HOSTINGSTARTUPASSEMBLIES: Orders.Entities;Customers.Entities;Monolith
    depends_on:
      - postgres

  orders:
    image: modular-data
    build: *build
    ports:
      - 5002:8080
    environment:
      ConnectionStrings__Postgres: Server=postgres;Port=5432;Database=modular;User Id=demo;Password=demo;Maximum Pool Size=45
      HOSTINGSTARTUPASSEMBLIES: Orders.Entities;OrdersMicroservice
      Services__customers__http__0: customers:8080
    depends_on:
      - customers
      - postgres

  customers:
    image: modular-data
    build: *build
    ports:
      - 5003:8080    
    environment:
      ConnectionStrings__Postgres: Server=postgres;Port=5432;Database=modular;User Id=demo;Password=demo;Maximum Pool Size=45
      HOSTINGSTARTUPASSEMBLIES: Customers.Entities;CustomersMicroservice
    depends_on:
      - postgres
  
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: modular
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      LANG: en_US.utf8
    ports:
      - 5432:5432